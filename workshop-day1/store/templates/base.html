<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Kestrel{% endblock %}</title>
<style>
:root{
  --bg:#0f1216; --panel:#161b22; --edge:#252c36; --ink:#e6edf3; --dim:#8b949e;
  --accent:#e0a458; --green:#2ea043; --amber:#d29922; --red:#da3633; --link:#58a6ff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:22px;padding:12px 20px;
  border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.3px}
header .brand span{color:var(--accent)}
header nav{display:flex;gap:16px;font-size:14px}
header .spacer{flex:1}
.badge{font:12px/1 var(--mono);padding:5px 9px;border-radius:999px;
  border:1px solid var(--edge);color:var(--dim);white-space:nowrap}
.badge.warn{border-color:var(--amber);color:var(--amber)}
.badge.mock{border-color:#8957e5;color:#c297ff;background:rgba(137,87,229,.12)}
.badge.live{border-color:var(--green);color:#7ee787;background:rgba(46,160,67,.12)}
.msg.why{align-self:flex-start;font:11.5px var(--mono);color:#c297ff;
  background:rgba(137,87,229,.10);border:1px dashed #8957e5;max-width:92%}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px}
.panel h2{margin:0 0 4px;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.panel .sub{margin:0 0 14px;font-size:13px;color:var(--dim)}
button{font:inherit;background:#21262d;color:var(--ink);border:1px solid var(--edge);
  border-radius:7px;padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1b1205;border-color:var(--accent);font-weight:600}
input,select,textarea{font:inherit;background:#0d1117;color:var(--ink);
  border:1px solid var(--edge);border-radius:7px;padding:9px 11px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--edge);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
code{font:13px var(--mono);background:#0d1117;border:1px solid var(--edge);
  border-radius:4px;padding:1px 5px}
pre{background:#0d1117;border:1px solid var(--edge);border-radius:8px;
  padding:13px;overflow:auto} pre code{border:0;background:none;padding:0;line-height:1.5}
blockquote{border-left:3px solid var(--accent);margin:14px 0;padding:2px 0 2px 14px;color:var(--dim)}
.lights{display:grid;gap:7px;margin-bottom:14px}
.light{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;
  border:1px solid var(--edge);background:#0d1117;font:13px var(--mono)}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.green .dot{background:var(--green)} .amber .dot{background:var(--amber)}
.red .dot{background:var(--red);box-shadow:0 0 0 4px rgba(218,54,51,.22)}
.red{border-color:var(--red);color:#ffb4b0} .amber{border-color:var(--amber);color:#f0c674}
.light .level{margin-left:auto;font-size:11px;letter-spacing:.6px}
.log{font:12px/1.6 var(--mono);background:#0d1117;border:1px solid var(--edge);
  border-radius:8px;padding:11px;max-height:330px;overflow:auto}
.log div{white-space:pre-wrap;padding:1px 0}
.log .alert{color:#ff7b72} .log .warn{color:#f0c674} .log .info{color:var(--dim)}
.chat{height:330px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:3px}
.msg.agent{align-self:flex-start;background:#21262d;border:1px solid var(--edge);border-bottom-left-radius:3px}
.msg.sys{align-self:center;font:11.5px var(--mono);color:var(--dim);background:none;border:0}
.msg.breach{align-self:stretch;max-width:100%;font:11.5px/1.55 var(--mono);color:#ffb4b0;
  background:rgba(218,54,51,.14);border:1px solid var(--red);border-radius:8px}
details.instructor summary{cursor:pointer;font-size:15px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--dim);font-weight:600}
details.instructor summary:hover{color:var(--accent)}
details.instructor[open] summary{color:var(--accent)}
tr.foreign td{background:rgba(218,54,51,.07)}
tr.foreign code{border-color:var(--red);color:#ffb4b0}
.row{display:flex;gap:9px;align-items:center}
.controls{display:grid;gap:7px}
.ctl{display:flex;gap:10px;align-items:center;padding:8px 11px;border:1px solid var(--edge);
  border-radius:7px;background:#0d1117;font-size:13px}
.ctl .k{font:12px var(--mono);color:var(--dim);min-width:210px}
.ctl.on{border-color:var(--green)} .ctl.on .k{color:var(--green)}
.ctl .blk{margin-left:auto;font-size:11px;color:var(--dim)}
.pill{display:inline-block;font:11px var(--mono);padding:2px 7px;border-radius:999px;
  border:1px solid var(--edge);color:var(--dim);margin-right:5px}
.attack{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--edge);
  border-radius:8px;background:#0d1117;margin-bottom:8px}
.attack .meta{flex:1;font-size:13px} .attack .meta b{display:block;margin-bottom:2px}
.attack .meta span{color:var(--dim);font-size:12px}
.lab .step{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:8px;
  border:1px solid var(--edge);background:#0d1117;margin-bottom:9px;flex-wrap:wrap}
.lab .step .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1b1205;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.lab .step .meta{flex:1;min-width:240px;font-size:13.5px}
.lab .step .meta span{color:var(--dim);font-size:12.5px}
.flowbox{flex-basis:100%;margin-top:11px;border:1px solid var(--edge);border-radius:8px;
  background:#0b0f14;overflow:hidden}
.flowhead{padding:8px 11px;border-bottom:1px solid var(--edge);font:12px var(--mono);
  color:var(--accent)}
.flowhead span{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.flowscroll{overflow-x:auto}
.flow{display:block}
.flowkey{flex-basis:100%;display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;
  font-size:11.5px;color:var(--dim)}
.flowkey i{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:6px;
  border-top-width:2px;border-top-style:solid}
.flowkey i.k-normal{border-top-color:#8b949e}
.flowkey i.k-payload{border-top-color:var(--amber)}
.flowkey i.k-breach{border-top-color:var(--red);border-top-style:dashed}
.verdict{padding:10px 13px;border-radius:8px;margin:14px 0 10px;font-weight:600;font-size:14px}
.verdict.bad{background:rgba(218,54,51,.14);border:1px solid var(--red);color:#ffb4b0}
.verdict.good{background:rgba(46,160,67,.14);border:1px solid var(--green);color:#7ee787}
.toc{list-style:none;margin:0;padding:0;font-size:13.5px}
.toc li{padding:5px 0;border-bottom:1px solid var(--edge)}
h1{font-size:23px;margin:0 0 6px} h2{font-size:18px;margin:26px 0 8px}
h3{font-size:15px;margin:20px 0 6px;color:var(--accent)}
.note{font-size:13px;color:var(--dim);margin-top:10px}
</style></head><body>
<header>
  <div class="brand">KESTREL<span>GOAT</span></div>
  <nav>
    <a href="/">Storefront</a><a href="/console">Control room</a><a href="/tutorial">Tutorials</a>
  </nav>
  <div class="spacer"></div>
  <div class="badge warn">DAY 1 &middot; THE EDGE</div>
  {% if badge %}<div class="badge {{ 'mock' if badge.kind=='mock' else 'live' }}"
       title="{{ badge.hint }}">{{ badge.text }}</div>{% endif %}
  <div class="badge">deliberately vulnerable &middot; never deploy</div>
</header>
<div class="wrap">{% block body %}{% endblock %}</div>
{% block script %}{% endblock %}
</body></html>
